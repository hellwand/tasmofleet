# Push to main: refreshes main's Go caches and publishes :edge. It runs lint, the unit and
# the integration tests and the build, but no e2e test: the pushed commit is the head of a
# pull request that was green, because main only moves forward by a fast-forward push of that
# head (docs/dev/pull-requests.md), so the e2e shards would only repeat
# the PR (#478).
#
# Why these tests still run: pull requests and tags do not save Go caches (#476), they restore
# main's. The tests run here, cacheable (no -count=1), so that the go test cache holds their
# RESULTS and the PR and tag jobs report unchanged packages as "(cached)". The e2e caches are
# refreshed by nightly.yml.
#
# Jobs:
#   checks          _checks.yml without e2e: lint, unit tests, build, integration tests
#   image           build and push :edge (_image.yml, mode edge)
#   ha-app          build-test the HA app image (_ha-app.yml); a failure never stops :edge
#   ghcr-cleanup    prune the registries after the image, whatever its result
#   cache-prune     delete the Go caches of main that a newer one supersedes, after the saving jobs (#692)
name: main

on:
  push:
    branches: [main]
    # Nothing here changes the image or the caches: docs, e2e tests, design files, fixtures and
    # the workflows of the other triggers. CHANGELOG.md is not on the list: the binary embeds it.
    paths-ignore:
      - "README.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "CLAUDE.md"
      - "docs/**"
      - "changes/**"
      - "e2e/**"
      - "design/**"
      - "testdata/**"
      - ".github/workflows/pr.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/nightly.yml"
      - ".github/workflows/weekly.yml"
      - ".github/workflows/_mutation.yml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

env:
  NICE: ""

jobs:
  checks:
    name: checks
    # pull-requests: read only because _checks.yml's revert-check job asks for it (see there); it does not run here.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_checks.yml
    with:
      e2e: none

  image:
    name: image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_image.yml
    with:
      mode: edge
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The Home Assistant app image, built and tested apart from :edge (#522): red on its own, never stops the push.
  ha-app:
    name: ha-app
    permissions:
      contents: read
    uses: ./.github/workflows/_ha-app.yml

  ghcr-cleanup:
    name: ghcr-cleanup
    needs: image
    # After the image build, whatever its result (a failed push can leave partial images behind).
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ghcr-cleanup.yml
    with:
      dry-run: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Keeps the newest Go cache of each series on main (#692). A later job: actions/cache saves in the post step of
  # `checks`, so nothing inside it can delete the entry it replaces. The grant is repeated here because a called
  # workflow cannot hold more than its caller gives it.
  cache-prune:
    name: cache-prune
    needs: checks
    # Whatever the checks' result: a job that failed or was cancelled saves nothing (actions/cache post-if: success()), but its siblings that passed have saved, and the older entries go either way; the prune is idempotent.
    if: ${{ always() }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/cache-prune.yml
    with:
      dry-run: false
